[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-embeddings"
version = "0.1.0"
description = "Embedding extraction and comparison for tabular foundation models"
# Pinned to the 3.12 series, not a floor. `>=3.10` was what let two interpreters
# into the worker pool (3.10.19 and 3.12.12), and the interpreter silently caps
# what else can be installed: numpy 2.3 requires >=3.11, so the 3.10 hosts were
# stuck at numpy 1.26/2.2 no matter what this file asked for. The numpy drift was
# a SYMPTOM of this line. Minor-series granularity is deliberate -- CPython patch
# releases do not move numerics the way a numpy major version does, and pinning
# ==3.12.12 would reject 3.12.13 for no benefit.
requires-python = ">=3.12,<3.13"
# EXACTLY PINNED, not floors. These are the versions that produced the paper's
# results (python 3.12.12). Floors like `numpy>=1.24` are satisfied by 1.26.4,
# 2.2.6 AND 2.3.5 simultaneously, so two `pip install -e .` runs on different
# dates yield different numeric stacks -- which is how the worker pool drifted to
# three numpy versions and two scikit-learn versions. numpy 2.x changed type
# promotion and scikit-learn drives preprocessing (StandardScaler,
# PowerTransformer), so these are not cosmetic.
# torch carries a CUDA local version (+cu124) that PyPI specifiers cannot express;
# install it from the matching index:
#   pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "torch==2.6.0",
    "scikit-learn==1.6.1",
    "scipy==1.16.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
# Individual model dependencies.
# VERSIONS ARE PINNED to the exact packages that produced the paper's results.
# The cached embeddings / SAEs / norm-stats are tied to these model versions;
# newer releases change architectures/dims (e.g. tabpfn 8.x, tabdpt 1.2.0) and
# silently break compatibility. Reference runtime: torch==2.6.0+cu124,
# numpy==2.3.5, python 3.12 -- now enforced in [project.dependencies] above
# rather than stated only here.
#
# TWO ENVIRONMENTS. The pins below describe `tfm`, the default. `tabicl_v2` needs
# a newer torch/tabicl that are incompatible with plain tabicl, so it lives in a
# separate `tfm2` env -- see the [tfm2] extra. Pair routing picks the env by
# whether the pair involves tabicl_v2, which means a model appearing in BOTH envs
# must be pinned identically in both or it silently runs two different versions
# depending on its partner (this happened: see the autogluon note under [tfm2]).
tabpfn = ["tabpfn==6.3.2"]
# Plain TabICL. PyPI latest is 2.x, which is the DIFFERENT tabicl_v2 model and
# belongs in a separate env (tfm2 uses tabicl==2.0.3). Unpinned silently
# installs v2 and breaks the plain-tabicl pairs.
tabicl = ["tabicl==0.1.4"]
tabdpt = ["tabdpt==1.1.12"]
hyperfast = ["hyperfast==1.0.6"]
carte = ["carte-ai==0.0.26", "torch_geometric==2.7.0"]
mitra = ["autogluon.tabular[mitra]==1.5.0"]
tabula8b = ["transformers==4.57.6", "bitsandbytes==0.49.2", "accelerate==1.12.0"]
mothernet = ["ticl @ git+https://github.com/microsoft/ticl.git"]

# All models (except mothernet which requires manual install)
models = [
    "tabpfn==6.3.2",
    "tabicl==0.1.4",  # plain TabICL; v2 (tabicl==2.0.3) lives in the tfm2 env
    "tabdpt==1.1.12",
    "hyperfast==1.0.6",
    "carte-ai==0.0.26",
    "torch_geometric==2.7.0",
    "autogluon.tabular[mitra]==1.5.0",
    "transformers==4.57.6",
    "bitsandbytes==0.49.2",
    "accelerate==1.12.0",
]

# The SECOND worker environment (`tfm2`), required for tabicl_v2 -- tabicl 2.x is
# a different model from plain tabicl 0.1.4 and needs a newer torch. Install with
#   pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cu126
# then `pip install -e .[tfm2]`. Core numeric stack is deliberately IDENTICAL to
# the tfm env (numpy/scipy/pandas/scikit-learn) so only the model layer differs.
#
# DISCREPANCY (2026-08-02, unresolved): deployed tfm2 envs carry
# autogluon.tabular==1.4.0 while tfm carries 1.5.0, so Mitra runs a different
# autogluon version depending on whether its pair involves tabicl_v2. tabpfn
# likewise differs (6.3.2 vs 7.0.1) but that one is required by the newer torch.
# The autogluon split appears to be drift, not intent; pinned to 1.5.0 here to
# match tfm, which means existing tfm2 envs need updating to comply.
tfm2 = [
    "torch==2.7.1",
    "tabicl==2.0.3",
    "tabpfn==7.0.1",
    "tabdpt==1.1.12",
    "carte-ai==0.0.26",
    "torch_geometric==2.7.0",
    "autogluon.tabular[mitra]==1.5.0",
]

# SAE training and hyperparameter optimization
sae = [
    "optuna==4.7.0",
    "wandb==0.24.2",
]

# Concept matching (Leiden community detection) + dataset meta-features.
# pymfe is imported by scripts/__init__.py, so this extra is NOT optional for
# most of the pipeline -- it is in [all] for that reason.
matching = [
    "igraph==1.0.0",
    "leidenalg>=0.10",
    "pymfe==0.4.4",
]

# Concept labeling (embedding-based convergence check)
labeling = [
    "sentence-transformers>=2.2",
    "einops",
    "openai>=1.0",
]

# Benchmark dataset loaders.
# openml was previously UNDECLARED despite being imported by
# scripts/sae_corpus/00_download_tabarena_splits.py -- the first step of the
# pipeline -- and by sae_sweep / row_level_probes / label_concepts /
# layerwise_cka_analysis. A fresh env built from this file could not download
# the TabArena splits.
benchmarks = [
    "relbench",
    "pmlb",
    "openml==0.15.1",
]

# Distributed execution
distributed = ["dask[distributed]"]

# Plotting extras (beyond matplotlib/seaborn in core)
plots = [
    "adjustText",
    "tqdm",
]

# Development and testing
dev = [
    "pytest>=7.0",
]

# Everything needed for a full worker environment.
# `matching` was previously EXCLUDED here despite pymfe being imported from
# scripts/__init__.py, so `pip install -e .[all]` produced an env that could not
# import most of the scripts package. `labeling` stays out on purpose: it is
# heavyweight (sentence-transformers) and labeling runs in Claude Code without an
# API key, so workers do not need it.
all = [
    "tabular-embeddings[models,sae,matching,benchmarks,distributed,plots,dev]",
]

[tool.setuptools.packages.find]
include = ["models*", "data*", "analysis*", "config*", "scripts*"]
exclude = ["output*", "notebooks*"]
